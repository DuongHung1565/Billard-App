services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cue
      POSTGRES_PASSWORD: cue_local_password
      POSTGRES_DB: cueclub
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["cue_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cue -d cueclub"]
      interval: 5s
      retries: 10
volumes:
  cue_data:
